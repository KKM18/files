<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Expense Tracker</h1>
            <p>Manage and track your daily expenses</p>
        </header>

        <div class="main-content">
            <!-- Input Section -->
            <section class="input-section">
                <h2>Add New Expense</h2>
                <form id="expenseForm">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input 
                            type="text" 
                            id="description" 
                            placeholder="e.g., Groceries, Gas, etc." 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount ($)</label>
                        <input 
                            type="number" 
                            id="amount" 
                            placeholder="0.00" 
                            step="0.01" 
                            min="0" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select a category</option>
                            <option value="Food">🍔 Food</option>
                            <option value="Transport">🚗 Transport</option>
                            <option value="Entertainment">🎬 Entertainment</option>
                            <option value="Shopping">🛍️ Shopping</option>
                            <option value="Bills">📄 Bills</option>
                            <option value="Health">🏥 Health</option>
                            <option value="Other">📌 Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Expense</button>
                </form>
            </section>

            <!-- Summary Section -->
            <section class="summary-section">
                <div class="summary-card">
                    <h3>Total Expenses</h3>
                    <p class="summary-amount" id="totalAmount">$0.00</p>
                </div>
                <div class="summary-card">
                    <h3>This Month</h3>
                    <p class="summary-amount" id="monthlyAmount">$0.00</p>
                </div>
                <div class="summary-card">
                    <h3>This Week</h3>
                    <p class="summary-amount" id="weeklyAmount">$0.00</p>
                </div>
            </section>

            <!-- Filter Section -->
            <section class="filter-section">
                <h2>Expenses</h2>
                <div class="filter-controls">
                    <select id="filterCategory">
                        <option value="">All Categories</option>
                        <option value="Food">🍔 Food</option>
                        <option value="Transport">🚗 Transport</option>
                        <option value="Entertainment">🎬 Entertainment</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Bills">📄 Bills</option>
                        <option value="Health">🏥 Health</option>
                        <option value="Other">📌 Other</option>
                    </select>
                    <button id="clearAllBtn" class="btn btn-danger">Clear All</button>
                </div>
            </section>

            <!-- Expenses List -->
            <section class="expenses-section">
                <table class="expenses-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expensesList">
                        <!-- Expenses will be added here -->
                    </tbody>
                </table>
                <div id="emptyMessage" class="empty-message">
                    <p>No expenses yet. Add one to get started! 📝</p>
                </div>
            </section>

            <!-- Chart Section -->
            <section class="chart-section">
                <h2>Spending by Category</h2>
                <canvas id="categoryChart"></canvas>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
